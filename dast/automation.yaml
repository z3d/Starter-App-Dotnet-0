# OWASP ZAP Automation Framework plan — DAST scan of the StarterApp API.
#
# This is a TEMPLATE: run-dast.sh renders the validated TARGET_URL and token
# as escaped YAML scalars into dast/reports/automation.rendered.yaml.
# Don't run this file directly; run dast/run-dast.sh.
#
# The API validates OIDC/JWT bearer tokens itself, so the `replacer` job below
# injects a real Authorization header — that lets ZAP scan the protected
# /api/v1 surface instead of bouncing off 401s at the door. The dev realm's 1h
# access-token lifespan covers the scan window; a longer full scan needs a
# re-minted token.

env:
  contexts:
    - name: starterapp-api
      urls:
        - __ZAP_BASE_URL__
      includePaths:
        - __ZAP_API_REGEX__
        - __ZAP_HEALTH_REGEX__
        - __ZAP_ALIVE_REGEX__
      excludePaths:
        # Static docs surfaces — no value in actively scanning them.
        - __ZAP_SCALAR_REGEX__
        - __ZAP_OPENAPI_REGEX__
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  # 1. Attach the scanned identity (dast-user-01) on every request so
  #    authenticated endpoints are reachable. matchType req_header adds the
  #    header if absent.
  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: "OIDC bearer token (dast-user-01, all resource scopes, amr incl. mfa)"
        matchType: req_header
        matchString: "Authorization"
        replacementString: __DAST_AUTH_HEADER__
        tokenProcessing: false

  # 2. Suppress false positives on the OpenAPI document itself.
  #    The generated /openapi/v1.json declares ProblemDetails 500 responses, so its
  #    body literally contains the reason phrase "Internal Server Error". ZAP's passive
  #    rules 90022 (Application Error Disclosure) and 10023 (Debug Error Messages)
  #    string-match that text and flag the API *documentation* as if it were a runtime
  #    error — it is not (the endpoint returns 200). The filter is scoped to that one
  #    URL only, so these rules still fire on every real endpoint (e.g. a genuine 500).
  - type: alertFilter
    alertFilters:
      - ruleId: 90022
        newRisk: "False Positive"
        url: __ZAP_OPENAPI_URL__
        urlRegex: false
      - ruleId: 10023
        newRisk: "False Positive"
        url: __ZAP_OPENAPI_URL__
        urlRegex: false
      # Path Traversal (rule 6) on the `page`/`pageSize` pagination params is a
      # false positive: both are strongly-typed `int` minimal-API parameters, so
      # ASP.NET model binding rejects any non-numeric (traversal) payload with a 400
      # before a handler ever runs. They flow only into integer LIMIT/OFFSET
      # arithmetic and parameterized Dapper SQL — no filesystem path is ever built.
      # Rule 6 check 6-5 is a response-comparison heuristic that intermittently flags
      # numeric params (attack value "10" == the original value), which is why it fires
      # non-deterministically across list endpoints. Scoped to the two pagination param
      # names AND the current int-paginated list-endpoint URLs, so a future string-typed
      # `page` param on another route does not silently inherit the suppression, and
      # rule 6 still actively tests every path segment and other param.
      - ruleId: 6
        newRisk: "False Positive"
        parameter: "^(page|pageSize)$"
        parameterRegex: true
        url: __ZAP_PAGINATION_REGEX__
        urlRegex: true

  # 3. Seed the site tree from the live OpenAPI document.
  - type: openapi
    parameters:
      apiUrl: __ZAP_OPENAPI_URL__
      targetUrl: __ZAP_BASE_URL__
      context: starterapp-api

  # 4. Crawl to discover anything not in the OpenAPI doc.
  - type: spider
    parameters:
      context: starterapp-api
      maxDuration: 2
      maxDepth: 8

  # 5. Let passive rules finish processing everything seen so far.
  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  # 6. Active scan — sends crafted attack payloads (injection, etc.).
  #    Bounded per-rule so a run stays in CI-friendly territory.
  - type: activeScan
    parameters:
      context: starterapp-api
      policy: "Default Policy"
      maxRuleDurationInMins: 3
      maxScanDurationInMins: 20

  # 7. Reports — HTML for humans, JSON for the run-dast.sh pass/fail gate.
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/reports
      reportFile: dast-report
      reportTitle: "StarterApp API — DAST Report"
      reportDescription: "OWASP ZAP dynamic scan of the StarterApp API."
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/reports
      reportFile: dast-report
      reportTitle: "StarterApp API — DAST Report"
