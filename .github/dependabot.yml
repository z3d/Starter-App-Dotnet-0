version: 2
updates:
  # No NuGet updater. Dependabot edits Directory.Packages.props but never the per-project
  # packages.lock.json files, so under locked-mode restore every NuGet PR failed NU1004 and
  # none ever merged. Bump by hand: change the version in Directory.Packages.props, run
  # `dotnet restore --force-evaluate`, and commit the props file with the regenerated locks.
  # Re-add trigger: Dependabot regenerates NuGet lock files for central package management.

  # GitHub Actions used by the workflows (keeps action versions/SHAs current).
  - package-ecosystem: "github-actions"
    # The composite action pins setup-dotnet too; Dependabot only scans listed directories.
    directories: ["/", "/.github/actions/dotnet-build"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # init and analyze are separate Dependabot dependencies but the same action: a PR
      # bumping only one fails with "Loaded a configuration file for version X, but
      # running version Y". Group them so they always move in a single commit.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Base images in the four Dockerfiles (dotnet sdk/aspnet, azure-functions runtime, node and nginx for the web).
  - package-ecosystem: "docker"
    directories:
      - "/src/StarterApp.Api"
      - "/src/StarterApp.DbMigrator"
      - "/src/StarterApp.Functions"
      - "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The web app. Minor and patch bumps come as one grouped PR a week.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # @types/node follows the Node line CI runs (setup-node '24'); move both together by hand.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # TypeScript 7 ships no JavaScript compiler API, which openapi-typescript needs for gen:api.
      # Re-add trigger: an openapi-typescript release that supports TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      web-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
