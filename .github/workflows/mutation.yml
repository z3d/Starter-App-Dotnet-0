name: Mutation

# Stryker.NET over the sample domain and the shared kernel. Too slow for every push and never in
# the pre-push gate: it runs weekly against main and on demand. It reports surviving mutants; it
# does not fail on a score (tests/mutation/run-mutation.sh sets --break-at 0).
on:
  schedule:
    - cron: '0 4 * * 0'   # Sundays 04:00 UTC, after the nightly perf and DAST runs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/dotnet-build

    - name: Mutation testing
      run: tests/mutation/run-mutation.sh | tee mutation-summary.txt

    - name: Summary
      if: always()
      run: sed -n '/^Mutation scores/,$p' mutation-summary.txt >> "$GITHUB_STEP_SUMMARY" || true

    - name: Upload the reports
      if: always() && !env.ACT
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mutation-reports
        path: tests/mutation/reports
        retention-days: 30
