name: Publish images

# Runs only after the CI Build workflow has passed on main, so an image that failed its Trivy scan
# is never pushed; a manual dispatch builds the ref it is given.
on:
  workflow_run:
    workflows: [ "CI Build" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

# packages: write is the one scope GHCR push needs; nothing here touches the repo.
permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: src/StarterApp.Api/Dockerfile
          - image: functions
            dockerfile: src/StarterApp.Functions/Dockerfile
          - image: dbmigrator
            dockerfile: src/StarterApp.DbMigrator/Dockerfile

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
        tags: |
          type=raw,value=${{ github.event.workflow_run.head_sha || github.sha }}
          type=raw,value=${{ github.event.workflow_run.head_branch || github.ref_name }}

    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
