name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: every job only reads the repo (build/test/docker-build/artifact
# upload). Declaring this here overrides the repository's broader default GITHUB_TOKEN
# scopes, so compromised build-time code (NuGet packages, analyzers) cannot push commits,
# alter releases, or publish packages. Grant any future write need on the specific job.
permissions:
  contents: read

# Cancel superseded runs: a new push to a branch/PR cancels the prior run on that same
# ref, so rapid pushes don't pile up parallel runs of the expensive integration/Aspire
# (Testcontainers) and docker-build jobs. Keyed per-workflow-per-ref, so main and
# distinct PRs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/dotnet-build

    - name: Verify formatting
      run: dotnet format --verify-no-changes --verbosity minimal --no-restore

    # DB-backed command/query handler tests share a Testcontainers PostgreSQL fixture even
    # though they are not named *Integration*, so the unit step also needs the image.
    - uses: ./.github/actions/pull-postgres

    - name: Unit tests
      # Aspire facts are [AspireFact] and skip themselves unless STARTERAPP_ASPIRE_TESTS is set,
      # so no filter is needed to keep the distributed rig out of this job.
      run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~Integration" --collect:"XPlat Code Coverage" --results-directory TestResults

    - name: Upload coverage
      if: always() && !env.ACT
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage
        path: TestResults/**/coverage.cobertura.xml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: npm ci --no-audit --no-fund

    - name: Verify formatting
      run: npm run format:check

    - name: Lint
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Unit tests
      run: npm test

    - name: Build
      run: npm run build

  # The web app in a browser against a stack of its own: PostgreSQL, the dev Keycloak with the
  # committed realm, the migrator and the API (web/e2e/run-e2e.sh), the same way the DAST and k6
  # harnesses boot theirs; then once more with the nginx image in front. The script also fails
  # when the committed generated client is not what the API serves.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/dotnet-build

    - uses: ./.github/actions/pull-postgres

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      working-directory: web
      run: npm ci --no-audit --no-fund

    - name: Install the browser
      working-directory: web
      run: npx playwright install --with-deps chromium

    # The Keycloak image, with the same retry loop; keep it in step with scripts/lib/dev-idp.sh.
    - name: Pre-pull the dev Keycloak image
      run: |
        source scripts/lib/dev-idp.sh
        for attempt in 1 2 3 4 5; do
          if docker pull "$DEV_IDP_IMAGE"; then exit 0; fi
          echo "::warning::docker pull $DEV_IDP_IMAGE failed (attempt $attempt/5); retrying in $((attempt * 10))s"
          sleep $((attempt * 10))
        done
        echo "::error::could not pull $DEV_IDP_IMAGE after 5 attempts"
        exit 1

    - name: Browser tests against a booted stack
      env:
        CI: "true"
      run: web/e2e/run-e2e.sh

    - name: Browser tests against the web image
      env:
        CI: "true"
        E2E_DEPLOYED: "1"
      run: web/e2e/run-e2e.sh

    - name: Upload the report on failure
      if: failure() && !env.ACT
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report
        path: |
          web/playwright-report
          web/test-results
          web/e2e-logs
        retention-days: 7

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/dotnet-build

    - uses: ./.github/actions/pull-postgres

    - name: Integration tests
      run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName~Integration"

  aspire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/dotnet-build

    - name: Trust ASP.NET Core dev cert
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y libnss3-tools
        dotnet dev-certs https --trust
        echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs:/etc/ssl/certs" >> "$GITHUB_ENV"

    - name: Aspire tests
      env:
        STARTERAPP_ASPIRE_TESTS: "true"
      run: dotnet test tests/StarterApp.AppHost.Tests --no-build --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build migrator image
      run: docker build -t starterapp/dbmigrator:ci -f src/StarterApp.DbMigrator/Dockerfile .

    - name: Scan migrator image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: starterapp/dbmigrator:ci
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: 1

    - name: Build api image
      run: docker build -t starterapp/api:ci -f src/StarterApp.Api/Dockerfile .

    - name: Scan api image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: starterapp/api:ci
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: 1

    - name: Build functions image
      run: docker build -t starterapp/functions:ci -f src/StarterApp.Functions/Dockerfile .

    - name: Scan functions image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: starterapp/functions:ci
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: 1

    - name: Build web image
      run: docker build -t starterapp/web:ci -f web/Dockerfile .

    - name: Scan web image
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: starterapp/web:ci
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: 1
