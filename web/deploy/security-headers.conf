# Included at server level and again in every location that sets a header of its own: nginx drops
# the inherited add_header lines the moment a location declares one.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# connect-src stays open: the identity provider is another origin known only at start-up.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src *; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
